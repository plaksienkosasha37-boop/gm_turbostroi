name: Build TurboStroi v2.9.0 - Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux64:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl tar file binutils uuid-dev

      - name: Download exact v2.9.0 source and git submodules
        run: |
          git clone --depth 1 --branch v2.9.0 --recurse-submodules \
            https://github.com/kosmik641/gm_turbostroi.git turbostroi
          cd turbostroi
          git submodule update --init --recursive
          git describe --tags --always

      - name: Build Premake 5 beta7 from source on Ubuntu 22.04
        run: |
          git clone --depth 1 --branch v5.0.0-beta7 --recurse-submodules \
            https://github.com/premake/premake-core.git premake-source
          cd premake-source
          make -f Bootstrap.mak linux
          cd ..
          PREMAKE_PATH="$(find premake-source -type f -name premake5 -print -quit)"
          if [ -z "$PREMAKE_PATH" ]; then
            echo 'ERROR: Premake binary was not produced by bootstrap.'
            find premake-source -type f -name '*premake*' | head -30
            exit 1
          fi
          cp "$PREMAKE_PATH" ./premake5
          chmod +x ./premake5
          ./premake5 --version

      - name: Compile 64-bit LuaJIT static library
        run: |
          cd turbostroi
          make -C external/luajit -j2 BUILDMODE=static XCFLAGS=-fPIC
          mkdir -p external/luajit/linux64
          cp external/luajit/src/libluajit.a external/luajit/linux64/libluajit.a

      - name: Generate x64 build files
        run: |
          cd turbostroi
          ../premake5 lualib2header
          ../premake5 gmake

      - name: Patch 32-bit-only float packing in Source SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('turbostroi/external')
          candidates = []
          for p in root.rglob('bitbuf.h'):
              content = p.read_text()
              if 'static_assert(sizeof(long) == sizeof(float));' in content:
                  candidates.append((p, content))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one original bitbuf.h, found {len(candidates)}')

          path, content = candidates[0]
          start = content.find('BITBUF_INLINE void bf_write::WriteBitFloat(float val)')
          if start == -1:
              raise SystemExit('WriteBitFloat implementation not found')
          end = content.find('\n}', start)
          if end == -1:
              raise SystemExit('WriteBitFloat function end not found')
          end += 2
          original = content[start:end]
          expected = (
              'long intVal;',
              'static_assert(sizeof(long) == sizeof(float));',
              'intVal = *((long*)&val);',
              'WriteUBitLong( intVal, 32 );',
          )
          if any(part not in original for part in expected):
              raise SystemExit('Unexpected WriteBitFloat implementation; refusing to patch')

          updated = (original
              .replace('long intVal;', 'unsigned int intVal = 0;')
              .replace('static_assert(sizeof(long) == sizeof(float));',
                       'static_assert(sizeof(unsigned int) == sizeof(float));')
              .replace('intVal = *((long*)&val);',
                       '__builtin_memcpy(&intVal, &val, sizeof(val));'))
          path.write_text(content[:start] + updated + content[end:])
          print(f'Patched float encoding in {path}')
          PY

      - name: Compile TurboStroi for Linux x64
        run: |
          cd turbostroi/projects/linux/gmake
          make -j2 config=release_x86_64

      - name: Verify ELF architecture and stage module
        run: |
          mkdir -p result
          DLL="$(find turbostroi/projects/linux -type f -name 'gmsv_turbostroi_linux64.dll' -print -quit)"
          if [ -z "$DLL" ]; then
            echo 'Build output gmsv_turbostroi_linux64.dll was not found'
            find turbostroi/projects/linux -type f -name '*.dll' -print
            exit 1
          fi
          file "$DLL"
          readelf -h "$DLL" | grep -F 'Class:'
          file "$DLL" | grep -q 'ELF 64-bit' || exit 1
          cp "$DLL" result/gmsv_turbostroi_linux64.dll
          sha256sum result/gmsv_turbostroi_linux64.dll

      - name: Upload downloadable x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: turbostroi-v2.9.0-linux64-experimental
          path: result/gmsv_turbostroi_linux64.dll
          if-no-files-found: error
