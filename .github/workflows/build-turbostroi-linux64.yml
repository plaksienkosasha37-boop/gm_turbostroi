name: Build TurboStroi v2.9.0 - Linux x64 (experimental V13)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-turbostroi-linux64.yml'

permissions:
  contents: read

jobs:
  build-linux64:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl tar file binutils uuid-dev

      - name: Download exact v2.9.0 source and git submodules
        run: |
          git clone --depth 1 --branch v2.9.0 --recurse-submodules \
            https://github.com/kosmik641/gm_turbostroi.git turbostroi
          cd turbostroi
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = '5360f2a8ffc19238137588cb11120a8eb809b0fc'
          git describe --tags --always

      - name: Build Premake 5 beta7 from source
        run: |
          git clone --depth 1 --branch v5.0.0-beta7 --recurse-submodules \
            https://github.com/premake/premake-core.git premake-source
          make -C premake-source -f Bootstrap.mak linux
          PREMAKE_PATH="$(find premake-source -type f -name premake5 -print -quit)"
          test -n "$PREMAKE_PATH"
          cp "$PREMAKE_PATH" ./premake5
          chmod +x ./premake5
          ./premake5 --version

      - name: Compile 64-bit LuaJIT static library
        run: |
          cd turbostroi
          make -C external/luajit -j2 BUILDMODE=static XCFLAGS=-fPIC
          mkdir -p external/luajit/linux64
          cp external/luajit/src/libluajit.a external/luajit/linux64/libluajit.a

      - name: Generate x64 build files
        run: |
          cd turbostroi
          ../premake5 lualib2header
          ../premake5 gmake

      - name: Patch Source SDK for Linux x64 (experimental)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sdk = Path('turbostroi/external/garrysmod_common/sourcesdk-minimal')

          def change_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              matches = text.count(old)
              if matches != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {matches}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'Patched {path}')

          # NetworkVar offsets must be computed without narrowing a real pointer.
          # The offset is still stored as int to preserve SDK interfaces.
          networkvar = sdk / 'public/networkvar.h'
          change_once(
              networkvar,
              '#define MyOffsetOf( type, var ) ( (int)&((type*)0)->var )',
              '#define MyOffsetOf( type, var ) static_cast<int>(__builtin_offsetof(type, var))',
          )

          # LP64 Linux has 8-byte long, but SDK CInterlockedInt is 4 bytes.
          # Use 4-byte GCC atomics without changing member layout/ABI.
          threadtools = sdk / 'public/tier0/threadtools.h'
          text = threadtools.read_text(encoding='utf-8')
          start_marker = 'template <typename T>\nclass CInterlockedIntT\n{'
          end_marker = '\ntypedef CInterlockedIntT<int> CInterlockedInt;'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Unexpected CInterlockedIntT layout in threadtools.h')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          original = text[start:end]
          if 'sizeof(T) == sizeof(long)' not in original:
              raise SystemExit('Original int/long size check was not found')

          atomic_64 = r'''template <typename T>
          class CInterlockedIntT
          {
          public:
              CInterlockedIntT() : m_value(0) { static_assert(sizeof(T) == 4, "32-bit atomic required"); }
              CInterlockedIntT(T value) : m_value(value) { static_assert(sizeof(T) == 4, "32-bit atomic required"); }

              T GetRaw() const { return __atomic_load_n(&m_value, __ATOMIC_SEQ_CST); }
              operator T() const { return GetRaw(); }
              bool operator!() const { return GetRaw() == 0; }
              bool operator==(T rhs) const { return GetRaw() == rhs; }
              bool operator!=(T rhs) const { return GetRaw() != rhs; }

              T operator++() { return __atomic_add_fetch(&m_value, T(1), __ATOMIC_SEQ_CST); }
              T operator++(int) { return __atomic_fetch_add(&m_value, T(1), __ATOMIC_SEQ_CST); }
              T operator--() { return __atomic_sub_fetch(&m_value, T(1), __ATOMIC_SEQ_CST); }
              T operator--(int) { return __atomic_fetch_sub(&m_value, T(1), __ATOMIC_SEQ_CST); }

              bool AssignIf(T conditionValue, T newValue)
              {
                  return __atomic_compare_exchange_n(&m_value, &conditionValue, newValue,
                      false, __ATOMIC_SEQ_CST, __ATOMIC_SEQ_CST);
              }
              T operator=(T newValue) { __atomic_store_n(&m_value, newValue, __ATOMIC_SEQ_CST); return newValue; }
              void operator+=(T add) { __atomic_fetch_add(&m_value, add, __ATOMIC_SEQ_CST); }
              void operator-=(T subtract) { __atomic_fetch_sub(&m_value, subtract, __ATOMIC_SEQ_CST); }
              void operator*=(T multiplier)
              {
                  T oldValue = GetRaw(), newValue;
                  do { newValue = oldValue * multiplier; }
                  while (!__atomic_compare_exchange_n(&m_value, &oldValue, newValue,
                      false, __ATOMIC_SEQ_CST, __ATOMIC_SEQ_CST));
              }
              void operator/=(T divisor)
              {
                  T oldValue = GetRaw(), newValue;
                  do { newValue = oldValue / divisor; }
                  while (!__atomic_compare_exchange_n(&m_value, &oldValue, newValue,
                      false, __ATOMIC_SEQ_CST, __ATOMIC_SEQ_CST));
              }
              T operator+(T rhs) const { return GetRaw() + rhs; }
              T operator-(T rhs) const { return GetRaw() - rhs; }

          private:
              volatile T m_value;
          };
          '''
          patched = (
              '#if defined(__linux__) && defined(__x86_64__)\n'
              + atomic_64
              + '#else\n'
              + original
              + '\n#endif // Linux x86_64 atomic port\n'
          )
          threadtools.write_text(text[:start] + patched + text[end:], encoding='utf-8')
          print(f'Patched {threadtools}')

          # Float wire encoding is exactly 32 bits, unlike Linux LP64 long.
          bitbufs = list(sdk.rglob('bitbuf.h'))
          candidates = [p for p in bitbufs if 'static_assert(sizeof(long) == sizeof(float));'
                        in p.read_text(encoding='utf-8')]
          if len(candidates) != 1:
              raise SystemExit(f'Expected 1 original bitbuf.h, found {len(candidates)}')
          bitbuf = candidates[0]
          text = bitbuf.read_text(encoding='utf-8')
          begin = text.find('BITBUF_INLINE void bf_write::WriteBitFloat(float val)')
          if begin < 0:
              raise SystemExit('WriteBitFloat not found')
          end = text.find('\n}', begin)
          if end < 0:
              raise SystemExit('WriteBitFloat closing brace not found')
          end += 2
          old = text[begin:end]
          expected = ('long intVal;', 'static_assert(sizeof(long) == sizeof(float));',
                      'intVal = *((long*)&val);', 'WriteUBitLong( intVal, 32 );')
          if not all(fragment in old for fragment in expected):
              raise SystemExit('Unexpected WriteBitFloat implementation')
          new = (old.replace('long intVal;', 'unsigned int intVal = 0;')
                    .replace('static_assert(sizeof(long) == sizeof(float));',
                             'static_assert(sizeof(unsigned int) == sizeof(float));')
                    .replace('intVal = *((long*)&val);',
                             '__builtin_memcpy(&intVal, &val, sizeof(val));'))
          bitbuf.write_text(text[:begin] + new + text[end:], encoding='utf-8')
          print(f'Patched {bitbuf}')

          # checksum_crc.cpp calculates a 0..3 alignment offset from a pointer.
          # On LP64, first convert to a pointer-sized integer, then mask it.
          crc_files = list(sdk.rglob('checksum_crc.cpp'))
          if len(crc_files) != 1:
              raise SystemExit(f'Expected 1 checksum_crc.cpp, found {len(crc_files)}')
          crc = crc_files[0]
          crc_text = crc.read_text(encoding='utf-8')
          before = 'nFront = ((unsigned int)pb) & 3;'
          after = 'nFront = static_cast<unsigned int>(reinterpret_cast<uintptr_t>(pb) & 3u);'
          if crc_text.count(before) != 1:
              raise SystemExit('Unexpected nFront pointer-alignment expression in checksum_crc.cpp')
          if '#include <stdint.h>' not in crc_text:
              crc_text = '#include <stdint.h>\n' + crc_text
          crc.write_text(crc_text.replace(before, after, 1), encoding='utf-8')
          print(f'Patched pointer alignment in {crc}')

          # memhandle_t is a 32-bit PACKED identifier stored in an opaque pointer
          # (16-bit serial + 16-bit index), not a dereferenceable memory address.
          # Preserve the 32-bit handle format; use uintptr_t for conversions.
          manager_headers = list(sdk.rglob('datamanager.h'))
          manager_sources = list(sdk.rglob('datamanager.cpp'))
          if len(manager_headers) != 1 or len(manager_sources) != 1:
              raise SystemExit(f'Unexpected data-manager files: {manager_headers}, {manager_sources}')
          header, source = manager_headers[0], manager_sources[0]
          h = header.read_text(encoding='utf-8')
          c = source.read_text(encoding='utf-8')
          old_h = 'unsigned int fullWord = (unsigned int)handle;'
          new_h = 'uintptr_t fullWord = reinterpret_cast<uintptr_t>(handle);'
          if h.count(old_h) != 1:
              raise SystemExit(f'{header}: unexpected FromHandle; no changes made')
          old_c = 'return (memhandle_t)( hiword|index );'
          new_c = 'return reinterpret_cast<memhandle_t>(static_cast<uintptr_t>(hiword | index));'
          if c.count(old_c) != 1:
              raise SystemExit(f'{source}: unexpected ToHandle; no changes made')
          if '#include <stdint.h>' not in h:
              h = '#include <stdint.h>\n' + h
          if '#include <stdint.h>' not in c:
              c = '#include <stdint.h>\n' + c
          header.write_text(h.replace(old_h, new_h, 1), encoding='utf-8')
          source.write_text(c.replace(old_c, new_c, 1), encoding='utf-8')
          print(f'Patched packed handle conversion in {header} and {source}')
          PY

      - name: Patch Linux x64 library handles and KeyValues serialization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sdk = Path('turbostroi/external/garrysmod_common/sourcesdk-minimal')
          # Linux dlopen() returns a pointer; HMODULE must be pointer-sized.
          platform = sdk / 'public/tier0/platform.h'
          contents = platform.read_text(encoding='utf-8')
          original = 'typedef uint32 HMODULE;'
          replacement = ('#if defined(__linux__) && defined(__x86_64__)\n'
                         'typedef void *HMODULE;\n'
                         '#else\n'
                         'typedef uint32 HMODULE;\n'
                         '#endif')
          if contents.count(original) != 1:
              raise SystemExit(f'Unexpected HMODULE declaration: {platform}')
          platform.write_text(contents.replace(original, replacement, 1), encoding='utf-8')
          print(f'Patched HMODULE: {platform}')

          # Preserve existing 32-bit TYPE_PTR wire format; do not truncate
          # real 64-bit addresses silently.
          kv = sdk / 'tier1/keyvalues.cpp'
          contents = kv.read_text(encoding='utf-8')
          old_write = 'buffer.PutUnsignedInt( (int)dat->m_pValue );'
          replacement_write = (
              'const uintptr_t pointerBits = reinterpret_cast<uintptr_t>(dat->m_pValue);\n'
              '                if (pointerBits > 0xffffffffULL)\n'
              '                    return false; // TYPE_PTR format can store only 32 bits\n'
              '                buffer.PutUnsignedInt(static_cast<unsigned int>(pointerBits));'
          )
          old_read = 'dat->m_pValue = (void*)buffer.GetUnsignedInt();'
          replacement_read = (
              'dat->m_pValue = reinterpret_cast<void*>('
              'static_cast<uintptr_t>(buffer.GetUnsignedInt()));'
          )
          if contents.count(old_write) != 1 or contents.count(old_read) != 1:
              raise SystemExit(f'Unexpected TYPE_PTR statements: {kv}')
          if '#include <stdint.h>' not in contents:
              contents = '#include <stdint.h>\n' + contents
          contents = contents.replace(old_write, replacement_write, 1)
          contents = contents.replace(old_read, replacement_read, 1)
          kv.write_text(contents, encoding='utf-8')
          print(f'Patched KeyValues: {kv}')
          PY

      - name: Verify x64 library and serialization patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sdk = Path('turbostroi/external/garrysmod_common/sourcesdk-minimal')
          platform = (sdk / 'public/tier0/platform.h').read_text(encoding='utf-8')
          kv = (sdk / 'tier1/keyvalues.cpp').read_text(encoding='utf-8')
          assert 'typedef void *HMODULE;' in platform
          assert 'TYPE_PTR format can store only 32 bits' in kv
          assert 'buffer.PutUnsignedInt( (int)dat->m_pValue );' not in kv
          assert 'dat->m_pValue = (void*)buffer.GetUnsignedInt();' not in kv
          print('V13 platform + KeyValues fixes are present')
          PY

      - name: Verify V13 patched headers before compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          print('V13: checking all datamanager.h files in downloaded source')
          matches = list(Path('turbostroi').rglob('datamanager.h'))
          if not matches:
              raise SystemExit('No datamanager.h found!')
          old = 'unsigned int fullWord = (unsigned int)handle;'
          new = 'uintptr_t fullWord = reinterpret_cast<uintptr_t>(handle);'
          for path in matches:
              content = path.read_text(errors='replace')
              print(f'{path}: old={old in content}, new={new in content}')
              for i, line in enumerate(content.splitlines(), 1):
                  if 'fullWord' in line or ('FromHandle' in line and 'inline' in line):
                      print(f'  {i}: {line.strip()}')
          expected = Path('turbostroi/external/garrysmod_common/sourcesdk-minimal/public/tier1/datamanager.h')
          if not expected.exists():
              raise SystemExit(f'Expected SDK header not found: {expected}')
          if new not in expected.read_text():
              raise SystemExit(f'Patch not applied to compiler SDK header: {expected}')
          unpatched = [str(p) for p in matches if old in p.read_text(errors='replace')]
          if unpatched:
              raise SystemExit(f'Unpatched copies remain: {unpatched}')
          print('V13 CHECK PASSED: No old DataManager pointer cast in source')
          PY

      - name: Compile TurboStroi for Linux x64
        run: |
          set -o pipefail
          cd turbostroi/projects/linux/gmake
          make -j2 config=release_x86_64 2>&1 | tee "$GITHUB_WORKSPACE/turbostroi-build-linux64.log"

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbostroi-v2.9.0-linux64-build-log
          path: turbostroi-build-linux64.log
          if-no-files-found: warn

      - name: Verify ELF architecture and stage module
        run: |
          mkdir -p result
          DLL="$(find turbostroi/projects/linux -type f -name 'gmsv_turbostroi_linux64.dll' -print -quit)"
          if [ -z "$DLL" ]; then
            echo 'Expected gmsv_turbostroi_linux64.dll was not produced.'
            find turbostroi/projects/linux -type f -name '*.dll' -print
            exit 1
          fi
          file "$DLL"
          readelf -h "$DLL" | grep -F 'Class:'
          file "$DLL" | grep -q 'ELF 64-bit'
          cp "$DLL" result/gmsv_turbostroi_linux64.dll
          sha256sum result/gmsv_turbostroi_linux64.dll

      - name: Upload experimental x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: turbostroi-v2.9.0-linux64-experimental-V13
          path: result/gmsv_turbostroi_linux64.dll
          if-no-files-found: error
